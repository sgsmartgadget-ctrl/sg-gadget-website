<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102a56"><title>Payment status | SG SMART TECH NEST</title><link rel="stylesheet" href="styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc"><section style="max-width:520px;width:100%;background:white;padding:34px;border-radius:20px;box-shadow:0 15px 45px #102a5612"><a class="brand" href="/" style="margin-bottom:28px"><span class="brand-mark">SG</span><span><b>SG SMART TECH NEST</b><small>SMART TECH. SMART LIFE.</small></span></a><span class="eyebrow">PAYMENT STATUS</span><h1 id="heading" style="color:#102a56;font-size:30px">Checking your payment…</h1><p id="detail" style="font-size:13px;line-height:1.8;color:#667085">Please wait while we confirm the transaction with the payment provider.</p><a class="button primary" href="/" style="margin-top:18px">Return to store</a><p style="font-size:10px;color:#8a94a6;line-height:1.7;margin-top:24px">Keep your payment reference if you need help. Do not make another payment until you have checked the transaction status.</p></section></main><script> (async()=>{const params=new URLSearchParams(location.search);const ref=params.get('reference');const h=document.getElementById('heading'),p=document.getElementById('detail');if(!ref){h.textContent='No payment reference found';p.textContent='We could not find a transaction reference in this link. If you paid, contact our team with your payment receipt.';return}try{const r=await fetch('/api/paystack/verify?reference='+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification is unavailable.');if(d.status==='success'&&d.verified){h.textContent='Payment confirmed';p.textContent='The payment provider reports a successful transaction. Reference: '+d.reference+'. Please save this reference and contact our team to confirm delivery arrangements.'}else{h.textContent='Payment not confirmed';p.textContent='Current status: '+(d.status||'unknown')+'. Reference: '+d.reference+'. If you believe you were charged, contact our team before trying again.'}}catch(e){h.textContent='Unable to verify right now';p.textContent=(e.message||'Verification failed')+' If you paid, keep your reference and contact our team before trying again.'}})();</script></body></html>
